name: Compile Native Binaries
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compile rclone for Android
        run: |
          mkdir -p dist
          cd /tmp
          curl -sL https://github.com/rclone/rclone/archive/refs/tags/v1.69.2.tar.gz | tar xz
          cd rclone-1.69.2
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o rclone
          cp rclone $GITHUB_WORKSPACE/dist/rclone

      - name: Compile zstd for Android
        run: |
          cd /tmp
          curl -sL https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz | tar xz
          cd zstd-1.5.6
          # NDK arm64 交叉编译（runner 是 x86-64，直接 gcc 会编出 x86-64 ELF，手机上无法执行）
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip
          export NDK_TOOLCHAIN=/tmp/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin
          make zstd-release -j$(nproc) \
            CC="$NDK_TOOLCHAIN/aarch64-linux-android21-clang" \
            AR="$NDK_TOOLCHAIN/llvm-ar" \
            RANLIB="$NDK_TOOLCHAIN/llvm-ranlib"
          cp programs/zstd $GITHUB_WORKSPACE/dist/zstd

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          tag: native-binaries
          name: "Pre-compiled native binaries"
          artifacts: "dist/rclone,dist/zstd"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          removeArtifacts: true
          body: "rclone v1.69.2 + zstd v1.5.6 for Android arm64"
